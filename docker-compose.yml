# NEXUS-SOC - full stack.
#   cp .env.example .env    (optionally add DEEPSEEK_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY)
#   docker compose up -d --build
#   open http://localhost:3000   (demo users: analyst, responder, manager, auditor, admin / SocDemo@2026)

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc-postgres-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-soc}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-soc-redis-password}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-soc-redis-password} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-soc-redis-password}

  # One-shot: migrations + demo data (only seeds an empty database).
  init:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_demo --if-empty"]

  backend:
    <<: *backend
    command: ["uvicorn", "soc.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-worker:
    <<: *backend
    command: ["python", "manage.py", "run_agentic_case_analysis_worker", "--interval", "1"]
    depends_on:
      init:
        condition: service_completed_successfully

  module-worker:
    <<: *backend
    command: ["python", "manage.py", "run_agentic_module_worker"]
    depends_on:
      init:
        condition: service_completed_successfully

  # Live log detection: syslog listener on UDP/TCP 5514 (the Windows Event Log needs the native command).
  live-detection:
    <<: *backend
    command: ["python", "manage.py", "run_live_detection", "--windows", "off", "--syslog-port", "5514"]
    ports:
      - "${LIVE_SYSLOG_PORT:-5514}:5514/udp"
      - "${LIVE_SYSLOG_PORT:-5514}:5514/tcp"
    depends_on:
      init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_BACKEND_PORT: ${API_PORT:-8000}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
